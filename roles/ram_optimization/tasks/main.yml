---
- name: Detect zram control interface
  ansible.builtin.stat:
    path: /sys/class/zram-control
  register: zram_control

- name: Try loading the zram kernel module
  ansible.builtin.command: modprobe zram
  register: zram_modprobe
  changed_when: false
  failed_when: false

- name: Set zram support fact
  ansible.builtin.set_fact:
    zram_supported: "{{ zram_control.stat.exists or zram_modprobe.rc == 0 }}"

- name: Configure zram on supported hosts
  when: zram_supported | bool
  block:
    - name: Install zram-tools
      ansible.builtin.apt:
        name: zram-tools
        state: present
        update_cache: true
        lock_timeout: 600

    - name: Configure zram swap
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        owner: root
        group: root
        mode: '0644'
        content: |
          ALGO={{ zram_algorithm }}
          PERCENT={{ zram_percent }}
          PRIORITY={{ zram_priority }}
      register: zram_config

    - name: Configure vm.swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ vm_swappiness }}"
        state: present
        sysctl_set: true
        reload: true

    - name: Enable zramswap service
      ansible.builtin.systemd:
        name: zramswap.service
        enabled: true

    - name: Restart zramswap when configuration changed  # noqa no-handler
      ansible.builtin.systemd:
        name: zramswap.service
        state: restarted
      register: zramswap_restart
      failed_when: false
      when: zram_config.changed

    - name: Collect zramswap status when restart failed  # noqa command-instead-of-module
      ansible.builtin.command: systemctl --no-pager -l status zramswap.service
      register: zramswap_status
      changed_when: false
      failed_when: false
      when:
        - zram_config.changed
        - zramswap_restart.failed | default(false)

    - name: Collect zramswap journal when restart failed
      ansible.builtin.command: journalctl -xeu zramswap.service --no-pager -n 80
      register: zramswap_journal
      changed_when: false
      failed_when: false
      when:
        - zram_config.changed
        - zramswap_restart.failed | default(false)

    - name: Fail when zram service fails in strict mode
      ansible.builtin.fail:
        msg: |
          zramswap.service restart failed.
          systemctl status:
          {{ zramswap_status.stdout | default('N/A') }}

          journalctl:
          {{ zramswap_journal.stdout | default('N/A') }}
      when:
        - zram_fail_on_service_error | bool
        - zram_config.changed
        - zramswap_restart.failed | default(false)

- name: Report unsupported zram kernel
  ansible.builtin.debug:
    msg: "zram kernel support not available on {{ inventory_hostname }}; skipping zram optimization."
  when: not zram_supported | bool
