---
- name: Validate Tailscale OS support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu', 'Raspbian']
    fail_msg: "This Tailscale role supports Debian, Ubuntu, and Raspbian hosts only."
  when: ts_enabled | bool

- name: Install Tailscale repository and package
  become: true
  when: ts_enabled | bool
  block:
    - name: Resolve Tailscale repository distribution
      ansible.builtin.set_fact:
        ts_repo_distribution: "{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}"

    - name: Install APT prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        lock_timeout: "{{ ts_apt_lock_timeout_seconds }}"
      register: ts_apt_prereq
      until: ts_apt_prereq is succeeded
      retries: "{{ ts_apt_retries }}"
      delay: "{{ ts_apt_retry_delay_seconds }}"

    - name: Ensure APT keyrings directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Tailscale repository keyring
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ts_repo_distribution }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'

    - name: Configure Tailscale repository
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ts_repo_distribution }}/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        owner: root
        group: root
        mode: '0644'

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
        lock_timeout: "{{ ts_apt_lock_timeout_seconds }}"
      register: ts_pkg_install
      until: ts_pkg_install is succeeded
      retries: "{{ ts_apt_retries }}"
      delay: "{{ ts_apt_retry_delay_seconds }}"

- name: Configure and validate Tailscale
  become: true
  when: ts_enabled | bool
  block:
    - name: Ensure tailscaled is enabled and running
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Check current Tailscale status
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false
      no_log: true

    - name: Determine whether this node needs enrollment or reconciliation
      ansible.builtin.set_fact:
        ts_needs_up: >-
          {{ ts_status.rc != 0 or ts_force_reauth | bool
             or ts_reapply_on_each_run | bool }}

    - name: Require an auth key only when Tailscale must change state
      ansible.builtin.assert:
        that: ts_auth_key | length > 0
        fail_msg: >-
          Tailscale is not enrolled or reconciliation was requested, but no
          vault_ts_auth_key/vault_tailscale_auth_key is available.
      when: ts_needs_up | bool

    - name: Enable kernel forwarding for an exit-node host
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - { name: net.ipv4.ip_forward, value: '1' }
        - { name: net.ipv6.conf.all.forwarding, value: '1' }
      when: ts_advertise_exit_node | bool

    - name: Build explicit Tailscale enrollment arguments
      ansible.builtin.set_fact:
        ts_up_argv: >-
          {{ [
            'tailscale', 'up', '--authkey=' ~ ts_auth_key,
            '--hostname=' ~ ts_hostname,
            '--accept-dns=' ~ (ts_accept_dns | ternary('true', 'false'))
          ]
          + (['--advertise-exit-node'] if ts_advertise_exit_node | bool else [])
          + (['--advertise-tags=' ~ (ts_tags | join(','))]
             if ts_tags | length > 0 else [])
          + (['--login-server=' ~ ts_login_server]
             if ts_login_server | length > 0 else [])
          + (ts_extra_args | default([])) }}
      no_log: true
      when: ts_needs_up | bool

    - name: Enroll or reconcile this node in the Tailnet
      ansible.builtin.command:
        argv: "{{ ts_up_argv }}"
      no_log: true
      register: ts_up
      changed_when: true
      when: ts_needs_up | bool

    - name: Validate Tailscale responds
      ansible.builtin.command: tailscale version
      changed_when: false

    - name: Validate this node has a Tailnet IPv4 address
      ansible.builtin.command: tailscale ip -4
      register: ts_ipv4
      changed_when: false
      failed_when: ts_ipv4.rc != 0
