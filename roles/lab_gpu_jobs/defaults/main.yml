---
# On-demand GPU jobs on lab (GTX 1050 2GB, Pascal sm_61) for ad-hoc work
# (Hermes delegates GPU tasks here). Jellyfin has priority on the GPU.
lab_gpu_jobs_enabled: false
lab_gpu_jobs_user: yeoun
lab_gpu_jobs_dir: /home/yeoun/gpu-jobs
# Images known to work on Pascal. PyTorch: cu126 only (cu128+ builds dropped sm_61).
lab_gpu_img_torch: pytorch/pytorch:2.8.0-cuda12.6-cudnn9-runtime
lab_gpu_img_ffmpeg: jellyfin/jellyfin:10.11.7@sha256:17285f9cce63b3519ccad82b84497fc22482c20f8b8bbe0580d51fec5deaa6fd
# Refuse to start unless this much VRAM is free (override: gpu-run --force).
lab_gpu_min_free_mb: 700
