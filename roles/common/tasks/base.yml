---
- name: Set timezone to Asia/Seoul
  community.general.timezone:
    name: Asia/Seoul

- name: Enable IPv4 forwarding for Docker routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: Configure APT network retries
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99network-retry
    owner: root
    group: root
    mode: '0644'
    content: |
      Acquire::Retries "5";
      Acquire::http::Timeout "20";
      Acquire::https::Timeout "20";
      Acquire::ForceIPv4 "true";

- name: Refresh APT cache with retry
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  register: apt_update_result
  until: apt_update_result is succeeded
  retries: 4
  delay: 5

- name: Resolve Tailscale DNS policy for current host
  ansible.builtin.set_fact:
    ts_dns_enabled_on_host: "{{ (ts_accept_dns_by_host | default({})).get(inventory_hostname, ts_accept_dns_default | default(true)) | bool }}"
    resolver_mode: "{{ (resolver_mode_by_host | default({})).get(inventory_hostname, 'systemd-resolved') }}"
    resolver_static_nameservers: >-
      {{ (resolver_static_nameservers_by_host | default({})).get(
         inventory_hostname,
         resolver_fallback_nameservers | default(['1.1.1.1', '9.9.9.9'])) }}

- name: Validate resolver mode
  ansible.builtin.assert:
    that: resolver_mode in ['static', 'systemd-resolved']
    fail_msg: "resolver_mode must be static or systemd-resolved, got {{ resolver_mode }}"
  when: not ts_dns_enabled_on_host | bool

- name: Stop systemd-resolved for an explicitly static resolver host
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'static'

- name: Remove resolver symlink before installing static configuration
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'static'

- name: Install static resolver configuration
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for nameserver in resolver_static_nameservers %}
      nameserver {{ nameserver }}
      {% endfor %}
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'static'

- name: Configure fallback DNS for systemd-resolved hosts
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNS='
    line: "DNS={{ resolver_static_nameservers | join(' ') }}"
    create: true
    owner: root
    group: root
    mode: '0644'
  register: resolved_config
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'

- name: Ensure systemd-resolved is enabled and running
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started
    enabled: true
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'

- name: Ensure systemd-resolved owns resolv.conf
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'

- name: Restart systemd-resolved after fallback DNS changes
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'
    - resolved_config.changed | default(false)
