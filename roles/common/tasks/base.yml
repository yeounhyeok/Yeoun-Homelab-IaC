---
- name: Set Timezone to Asia/Seoul
  ansible.builtin.timezone:
    name: Asia/Seoul

- name: Enable IPv4 forwarding for Docker routing
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: Configure APT network retries
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99network-retry
    mode: '0644'
    content: |
      Acquire::Retries "5";
      Acquire::http::Timeout "20";
      Acquire::https::Timeout "20";
      Acquire::ForceIPv4 "true";

- name: Refresh APT cache with retry
  ansible.builtin.command: apt-get update
  register: apt_update_result
  changed_when: false
  retries: 4
  delay: 5
  until: apt_update_result.rc == 0

- name: Install rsync
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: false

- name: Resolve Tailscale DNS policy for current host
  ansible.builtin.set_fact:
    ts_dns_enabled_on_host: "{{ (ts_accept_dns_by_host | default({})).get(inventory_hostname, ts_accept_dns_default | default(true)) | bool }}"
    resolver_mode: "{{ (resolver_mode_by_host | default({})).get(inventory_hostname, 'systemd-resolved') }}"
    resolver_static_nameservers: "{{ (resolver_static_nameservers_by_host | default({})).get(inventory_hostname, resolver_fallback_nameservers | default(['1.1.1.1', '9.9.9.9'])) }}"

- name: Disable systemd-resolved for an explicitly static resolver host
  ansible.builtin.service:
    name: systemd-resolved
    state: stopped
    enabled: false
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'static'

- name: Install static resolver configuration for an explicitly static resolver host
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: '0644'
    content: "{{ resolver_static_nameservers | map('regex_replace', '^(.*)$', 'nameserver \\1') | join('\\n') }}\\n"
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'static'

- name: Configure fallback DNS for systemd-resolved hosts
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNS='
    line: "DNS={{ resolver_static_nameservers | join(' ') }}"
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'

- name: Ensure systemd-resolved owns resolv.conf on resolver-managed hosts
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'

- name: Restart systemd-resolved after fallback DNS changes
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
    enabled: true
  when:
    - not ts_dns_enabled_on_host | bool
    - resolver_mode == 'systemd-resolved'
