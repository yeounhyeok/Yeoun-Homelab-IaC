---
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s+'
    line: "PasswordAuthentication {{ ssh_password_authentication | ternary('yes', 'no') }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH after policy changes

- name: Configure SSH keyboard-interactive authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KbdInteractiveAuthentication\s+'
    line: "KbdInteractiveAuthentication {{ ssh_kbd_interactive_authentication | ternary('yes', 'no') }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH after policy changes

- name: Keep PAM enabled for supported MFA integrations
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?UsePAM\s+'
    line: "UsePAM {{ ssh_use_pam | ternary('yes', 'no') }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH after policy changes
