---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    lock_timeout: 600
  register: docker_deps_install
  until: docker_deps_install is succeeded
  retries: 5
  delay: 10

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the Docker repository keyring
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /usr/share/keyrings/docker-archive-keyring.asc
    owner: root
    group: root
    mode: '0644'
    force: true
    timeout: 20
  register: docker_key_download
  retries: 3
  delay: 5
  until: docker_key_download is succeeded

- name: Resolve Docker APT architecture
  ansible.builtin.set_fact:
    docker_apt_arch: >-
      {{ ({'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}).get(
           ansible_facts['architecture'], ansible_facts['architecture']) }}

- name: Configure the managed Docker repository
  ansible.builtin.apt_repository:
    filename: docker
    repo: >-
      deb [arch={{ docker_apt_arch }}
      signed-by=/usr/share/keyrings/docker-archive-keyring.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    update_cache: true
  register: docker_repo
  until: docker_repo is succeeded
  retries: 5
  delay: 10

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: false
    lock_timeout: 600
  register: docker_engine_install
  until: docker_engine_install is succeeded
  retries: 5
  delay: 10

- name: Configure Docker daemon logging
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: "{{ docker_daemon_config | to_nice_json }}\n"
  notify: Restart Docker after daemon configuration changes

- name: Ensure Docker is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: docker_service_manage | bool

- name: Add the Ansible user to the Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
