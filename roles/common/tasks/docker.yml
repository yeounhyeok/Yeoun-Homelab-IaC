---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    lock_timeout: 600
  register: docker_deps_install
  until: docker_deps_install is succeeded
  retries: 5
  delay: 10

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check whether the Docker repository keyring exists
  ansible.builtin.stat:
    path: "{{ docker_apt_keyring }}"
  register: docker_keyring_stat

# get_url cannot predict check-mode results (it compares to an empty file), so
# only download when the key is missing or a refresh is explicitly forced.
- name: Install the Docker repository keyring
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: '0644'
    force: "{{ docker_apt_keyring_force | bool }}"
    timeout: 20
  register: docker_key_download
  retries: 3
  delay: 5
  until: docker_key_download is succeeded
  when: not docker_keyring_stat.stat.exists or docker_apt_keyring_force | bool

- name: Resolve Docker APT architecture
  ansible.builtin.set_fact:
    docker_apt_arch: >-
      {{ ({'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}).get(
           ansible_facts['architecture'], ansible_facts['architecture']) }}

- name: Configure the managed Docker repository
  ansible.builtin.apt_repository:
    filename: docker
    repo: >-
      deb [arch={{ docker_apt_arch }}
      signed-by={{ docker_apt_keyring }}]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    update_cache: true
  register: docker_repo
  until: docker_repo is succeeded
  retries: 5
  delay: 10

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: false
    lock_timeout: 600
  register: docker_engine_install
  until: docker_engine_install is succeeded
  retries: 5
  delay: 10

- name: Read the current Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_current_raw
  failed_when: false

# Compare parsed JSON, not bytes: a whitespace-only rewrite would otherwise
# restart dockerd (and every container without live-restore).
- name: Decide whether daemon.json differs semantically
  ansible.builtin.set_fact:
    docker_daemon_needs_write: >-
      {{ docker_daemon_current_raw.content is not defined
         or (docker_daemon_current_raw.content | b64decode | from_json) != docker_daemon_config }}

- name: Configure Docker daemon logging
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: "{{ docker_daemon_config | to_nice_json }}\n"
  when: docker_daemon_needs_write | bool
  notify: Restart Docker after daemon configuration changes

- name: Ensure Docker is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: docker_service_manage | bool

- name: Add the Ansible user to the Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
