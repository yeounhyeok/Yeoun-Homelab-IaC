---
- name: Restart Docker after daemon configuration changes
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when: docker_service_manage | bool

- name: Restart SSH after policy changes
  ansible.builtin.systemd:
    name: "{{ ssh_service_name }}"
    state: restarted
    daemon_reload: true
