---
# Apply only after a fresh Ubuntu install and after the preserved-state backup
# has been verified. This playbook never formats disks or restores application data.
- name: Rebuild the n4000 host baseline after eMMC reprovisioning
  hosts: n4000
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted shared variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      no_log: true

    - name: Apply host-specific variables
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ host_specific[inventory_hostname] | default({}) | dict2items }}"
      no_log: true

    - name: Refuse a non-n4000 target
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'n4000'
          - ansible_facts.os_family == 'Debian'
        fail_msg: "n4000_rebuild.yml is intentionally limited to a freshly installed Ubuntu/Debian n4000 host."

  roles:
    - role: common
      tags: [baseline, common]
    - role: ram_optimization
      tags: [baseline, ram]
    - role: tailscale
      tags: [baseline, tailscale]
    - role: n4000_rebuild
      tags: [baseline, n4000_rebuild]
