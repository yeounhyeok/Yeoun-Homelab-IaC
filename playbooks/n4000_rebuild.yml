---
# Apply only after a fresh Ubuntu install. This playbook never formats disks,
# restores application data, or starts application containers.
- name: Rebuild the n4000 host baseline after eMMC reprovisioning
  hosts: n4000
  become: true
  gather_facts: true
  vars:
    n4000_mount_data_disk: false
  pre_tasks:
    - name: Refuse a non-n4000 target
      ansible.builtin.assert:
        that: inventory_hostname == 'n4000'
        fail_msg: "This playbook is intentionally limited to inventory host n4000."
  roles:
    - role: common
      tags: [baseline, common]
    - role: ram_optimization
      tags: [baseline, ram]
    - role: tailscale
      tags: [baseline, tailscale]
    - role: n4000_rebuild
      tags: [baseline, n4000_rebuild]
