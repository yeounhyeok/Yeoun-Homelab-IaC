---
# Run only after the selected encrypted compose/config artifacts and native
# database dumps have been restored and reviewed on the rebuilt n4000.
- name: Start selected n4000 compose projects after state restoration
  hosts: n4000
  become: true
  gather_facts: false
  vars:
    compose_restore_service_root: "/home/{{ ansible_user }}/docker_volumes"
    compose_restore_services: []
  roles:
    - role: compose_restore
      tags: [restore]
