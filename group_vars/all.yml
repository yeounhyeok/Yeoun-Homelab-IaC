---
# Network and resolver policy. Application storage is not configured here.

# 2026-10-22: every node, including n4000, accepts Tailscale MagicDNS
# (resolv.conf -> 100.100.100.100). NPM on n4000 resolves *.soay-quail.ts.net
# upstreams through it, so forcing a static resolver there breaks routing.
# Known risk to revisit: if the tailnet's global DNS points at n4000's own
# AdGuard, n4000 depends on itself for name resolution.
ts_accept_dns_default: true
ts_accept_dns_by_host: {}

ts_advertise_exit_node_by_host:
  n4000: false

resolver_mode_by_host:
  n4000: static
resolver_static_nameservers_by_host:
  n4000:
    - 1.1.1.1
    - 9.9.9.9
resolver_fallback_nameservers:
  - 1.1.1.1
  - 9.9.9.9
