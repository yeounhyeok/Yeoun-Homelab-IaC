---
# Network and resolver policy. Application storage is not configured here.

# n4000 must not bootstrap through a DNS service hosted on itself.
ts_accept_dns_default: true
ts_accept_dns_by_host:
  n4000: false

ts_advertise_exit_node_by_host:
  n4000: false

resolver_mode_by_host:
  n4000: static
resolver_static_nameservers_by_host:
  n4000:
    - 1.1.1.1
    - 9.9.9.9
resolver_fallback_nameservers:
  - 1.1.1.1
  - 9.9.9.9
