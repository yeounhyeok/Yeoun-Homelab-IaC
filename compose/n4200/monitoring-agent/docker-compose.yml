# Managed in Yeoun-Homelab-IaC (compose/n4200/monitoring-agent).
services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: "100.107.164.5:45876"
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMguxjbOOZu+vC6GO/YgNGNYkWUZT6FH5lYNzrkWJn0D"
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    restart: unless-stopped
    command: agent
    environment:
      DOZZLE_HOSTNAME: n4200
    ports:
      - "100.107.164.5:7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
