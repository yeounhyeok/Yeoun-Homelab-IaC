# Managed in Yeoun-Homelab-IaC (compose/n4000/moa-monitoring).
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: moa-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "100.124.4.110:9091:9090"
    depends_on:
      - blackbox

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: moa-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "100.124.4.110:9115:9115"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: moa-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "100.124.4.110:3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
