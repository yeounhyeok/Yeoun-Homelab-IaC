# Managed in Yeoun-Homelab-IaC (compose/n4000/nextcloud). Secrets are ${VAR} only;
# values live in Vaultwarden item 'homelab/n4000/nextcloud' and are rendered into .env by Ansible.
services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:34.0.2-ls445 # pinned after PHP-FPM SIGSEGV recovery
    container_name: nextcloud
    restart: always
    networks:
      - cloud
    depends_on:
      redis:
        condition: service_started
      nextcloud-db:
        condition: service_healthy
    ports:
      - 9080:80
    volumes:
      - ./config:/config  # 설정, 앱, 내부 데이터를 관리하는 통합 볼륨 (PUID/PGID 제어)
      - /home/yeoun:/mnt/host_yeoun:rw
      - /mnt/usb:/mnt/external_usb:rw # 외부 저장소 마운트 (설치 후 Nextcloud에서 연결)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=nextcloud-db

      - NEXTCLOUD_OVERWRITEHOST=nextcloud.yeoun.org
      - NEXTCLOUD_OVERWRITEPROTOCOL=https
      - APACHE_HTTP_PORT=80   # 추가 (내부 HTTP 포트 명시)
      - NEXTCLOUD_TRUSTED_DOMAINS=192.168.45.225 nextcloud.yeoun.org
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379

      - PHP_MEMORY_LIMIT=1600M
      - PHP_MAX_EXECUTION_TIME=3600
      - PHP_MAX_INPUT_TIME=3600
      
      - PHP_UPLOAD_MAX_FILESIZE=16G # 👈 업로드 파일 사이즈 설정
      - PHP_POST_MAX_SIZE=16G   # 6GB 중 안전선
    


  redis:

    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - ./redis:/data 
    networks:
      - cloud

  nextcloud-db:
    image: mariadb:11.8.6
    container_name: nextcloud-db
    restart: always
    command: ["mariadbd", "--transaction-isolation=READ-COMMITTED", "--binlog-format=ROW", "--max-connections=200"]
    env_file:
      - .env.db
    volumes:
      - ./db:/var/lib/mysql
    mem_limit: 1g
    networks:
      - cloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  cloud:
    name: cloud
    driver: bridge
