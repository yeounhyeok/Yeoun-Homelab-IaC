real_ip_header CF-Connecting-IP;

# Web browsers only: report "no HEVC" so Jellyfin transcodes HEVC to H.264 on
# lab's GTX 1050 instead of direct-playing it. Browsers (e.g. Linux Chrome) claim
# HEVC support via canPlayType but stutter in decode; jellyfin-web decides
# direct play from canPlayType alone (jellyfin-web#2180, #6159). Native apps
# (Jellyfin Media Player, Android app) define window.NativeShell and are untouched.
# Bitrate: Jellyfin scales HEVC->H.264 by 1/0.6 (EncodingHelper.ScaleBitrate).
location ~ ^/web/(index\.html)?$ {
  proxy_set_header Accept-Encoding "";
  # Never let a browser revalidate to a cached copy without the script (304).
  proxy_set_header If-None-Match "";
  proxy_set_header If-Modified-Since "";
  proxy_hide_header ETag;
  proxy_hide_header Last-Modified;
  add_header Cache-Control "no-store" always;
  sub_filter_once on;
  sub_filter '</head>' '<script>(function(){var r=/hvc1|hev1|hevc|dvh1|dvhe/i;function off(t){return !window.NativeShell&&r.test(t||"")}var p=HTMLMediaElement.prototype,c=p.canPlayType;p.canPlayType=function(t){return off(t)?"":c.call(this,t)};var M=window.MediaSource;if(M&&M.isTypeSupported){var s=M.isTypeSupported.bind(M);M.isTypeSupported=function(t){return off(t)?false:s(t)}}})();</script></head>';
  include conf.d/include/proxy.conf;
}
