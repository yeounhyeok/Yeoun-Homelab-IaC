# Managed in Yeoun-Homelab-IaC (compose/n4000/nginx-proxy-manager).
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./json_logs.conf:/etc/nginx/conf.d/json_logs.conf
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
