# Managed in Yeoun-Homelab-IaC (compose/n4000/navidrome).
services:
  navidrome:
    # Pinned 2026-10-27 (was :latest but stuck at 0.61.2). AudioMuse plugin v10 is tested on 0.64.x.
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    restart: always
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=@every 5m
      - ND_LOGLEVEL=info
      # AudioMuse-AI sonic similarity (lab) for Instant Mix / getSimilarSongs / artist info.
      # Plugin file: plugins/audiomuseai.ndp -> navidrome_data/plugins (playbooks/navidrome_plugins.yml).
      # Agent order matters: first agent with sonic similarity wins.
      - ND_PLUGINS_ENABLED=true
      - ND_AGENTS=audiomuseai,lastfm,deezer
      - ND_DEVARTISTINFOTIMETOLIVE=1s
    volumes:
      - type: bind   # 2026-10-16: HDD 미마운트 시 빈 폴더로 기동 방지
        source: /mnt/usb/media/Musics
        target: /music
        bind:
          create_host_path: false
      - "./navidrome_data:/data"
