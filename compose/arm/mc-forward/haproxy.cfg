global
  log stdout format raw local0
defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 10m
  timeout server 10m
frontend mc
  bind :25565
  # 차단 목록: blocklist.lst (CIDR 한 줄씩, 수정 후 컨테이너 재시작)
  tcp-request connection reject if { src -f /usr/local/etc/haproxy/blocklist.lst }
  default_backend lab
backend lab
  # lab = WSL docker mc-server (via Tailscale + Windows portproxy). PROXY v2 keeps real player IP.
  server lab 100.65.253.68:25565 send-proxy-v2
