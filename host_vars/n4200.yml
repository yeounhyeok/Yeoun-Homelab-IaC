---
# zram swap is active here (zstd, 50%, swappiness 100) since before 2026-10.
ram_optimization_enabled: true

# Compose projects tracked in compose/n4200/ (2026-10-22 import).
compose_projects:
  - { name: glances, dir: docker_volumes/glances, file: compose.yml }
  - { name: home-assistant, dir: docker_volumes/home-assistant, file: compose.yml }
  - { name: homepage, dir: docker_volumes/homepage, file: docker-compose.yml, secrets: true }
  - { name: jellyfin, dir: docker_volumes/jellyfin, file: docker-compose.yml }
  - { name: monitoring-agent, dir: docker_volumes/monitoring-agent, file: docker-compose.yml }
  - { name: open-webui, dir: docker_volumes/open-webui, file: docker-compose.yml, secrets: true }
  - { name: quartz, dir: docker_volumes/quartz, file: docker-compose.yml }
  - { name: syncthing_n4200, dir: docker_volumes/syncthing_n4200, file: docker-compose.yml }
  - { name: vikunja, dir: docker_volumes/vikunja, file: docker-compose.yml, secrets: true }
  - { name: astro-blog, dir: services/astro-blog, file: compose.yml }

# LEGACY (2026-10-26, old 192.168.45.0/24 home network): the home router forwarded
# UDP 41643 -> n4200 192.168.45.99 so lab/arm could reach it directly. Since the
# 2026-11-16 SKB cutover there is no port forwarding (modem 192.168.55.1 has no
# rules; n4200 is 192.168.55.99) and Tailscale direct paths come from NAT hole
# punching. ts_port is kept as-is.
ts_port: 41643
