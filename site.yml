---
# The default playbook is intentionally boring: it manages only the shared
# host baseline. Application data is restored by an explicit playbook.
- name: Apply the shared host baseline
  hosts: all
  become: true
  roles:
    - role: common
      tags: [baseline, common]
    - role: ram_optimization
      tags: [baseline, ram]
    - role: tailscale
      tags: [baseline, tailscale]
