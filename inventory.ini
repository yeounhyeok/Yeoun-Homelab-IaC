# The inventory uses stable SSH/Tailscale aliases rather than the old public
# reverse-proxy endpoint with per-node ports. For first-boot n4000 access use
# inventory/bootstrap.ini.example and a temporary LAN address.
[oci_nodes]
arm ansible_host=arm ansible_user=ubuntu ansible_port=22

[home_nodes]
n4000 ansible_host=n4000 ansible_user=yeoun ansible_port=22
n4200 ansible_host=n4200 ansible_user=yeoun ansible_port=22

[nodes:children]
oci_nodes
home_nodes

[all:vars]
ansible_python_interpreter=/usr/bin/python3
