# The inventory uses stable SSH/Tailscale aliases rather than the old public
# reverse-proxy endpoint with per-node ports. For first-boot n4000 access use
# inventory/bootstrap.ini.example and a temporary LAN address.
[oci_nodes]
arm ansible_host=arm ansible_user=ubuntu ansible_port=22

[home_nodes]
n4000 ansible_host=n4000 ansible_user=yeoun ansible_port=22
n4200 ansible_host=n4200 ansible_user=yeoun ansible_port=22

[wsl_nodes]
# lab = 연구실 Windows 11 PC(SSD는 운혁 님 소유). WSL2 Ubuntu 24.04 sshd :2222,
# Windows portproxy(Tailscale IP)로만 노출. ~/.ssh/config Host lab-wsl.
lab ansible_host=lab-wsl ansible_user=yeoun

[windows_nodes]
# lab의 Windows 호스트 자체(OpenSSH, 기본 셸 cmd). Tailscale·portproxy·방화벽 담당.
# WSL(lab)과 같은 PC. site.yml(nodes)에는 포함하지 않는다.
lab-win ansible_host=lab ansible_user=yeoun ansible_connection=ssh ansible_shell_type=cmd

[nodes:children]
oci_nodes
home_nodes
wsl_nodes

[all:vars]
ansible_python_interpreter=/usr/bin/python3
